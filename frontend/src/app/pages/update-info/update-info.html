<div class="container">
  <!-- Panneau gauche vert -->
  <div class="left-panel">
    <h1>Modifier mes informations</h1>
    <p>Mettez à jour vos données personnelles en toute sécurité.</p>
  </div>

  <!-- Panneau droit formulaire -->
  <div class="right-panel">
    <h2>Mes informations</h2>

    <div *ngIf="successMsg" class="alert alert-success">{{ successMsg }}</div>
    <div *ngIf="errorMsg" class="alert alert-error">{{ errorMsg }}</div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!loading || form">
      <div class="form-group">
        <label>Prénom</label>
        <input type="text" formControlName="prenom" placeholder="Votre prénom">
      </div>

      <div class="form-group">
        <label>Nom</label>
        <input type="text" formControlName="nom" placeholder="Votre nom">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="exemple@email.com">
      </div>

      <div class="form-group">
        <label>Téléphone</label>
        <input type="tel" formControlName="telephone" placeholder="+221 ..">
      </div>

      <div class="form-group">
        <label>Adresse</label>
        <input type="text" formControlName="adresse" placeholder="Votre adresse">
      </div>

      <div class="form-group">
        <label>Statut</label>
        <select formControlName="statut">
          <option value="utilisateur">Agriculteur</option>
          <option value="admin">Acheteur</option>
           <option value="gestion">gestionnaire</option>
        </select>
      </div>

      <div class="form-group">
        <label>Nouveau mot de passe (optionnel)</label>
        <input type="password" formControlName="password" placeholder="Laisser vide pour ne pas changer">
      </div>

      <div class="form-group">
        <label>Confirmer le mot de passe</label>
        <input type="password" formControlName="password_confirmation">
      </div>

      <button type="submit" class="btn-save" [disabled]="loading">
        {{ loading ? 'Enregistrement...' : 'Enregistrer' }}
      </button>
    </form>
  </div>
</div>
